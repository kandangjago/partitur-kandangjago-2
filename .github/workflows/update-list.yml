name: Generate Partitur Manifest
on:
  push:
    paths:
      - 'partitur/**'
      - 'partitur.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate partitur.json
        run: |
          python - << 'PY'
          import os, json, pathlib
          folder = pathlib.Path('partitur')
          if not folder.exists():
              folder.mkdir(parents=True, exist_ok=True)
          files = sorted([f.name for f in folder.glob('*.pdf') if f.is_file()])
          data = [{"title": os.path.splitext(f)[0].replace('_',' ').replace('-',' ').strip(), "file": f} for f in files]
          # urut abjad Indonesia
          data = sorted(data, key=lambda x: x['title'].lower())
          pathlib.Path('partitur.json').write_text(json.dumps(data, indent=2, ensure_ascii=False), encoding='utf-8')
          print(f"Generated {len(data)} entries -> partitur.json")
          print(data)
          PY

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add partitur.json
          git diff --staged --quiet || (git commit -m "Auto update partitur.json - $(date)" && git push)
          

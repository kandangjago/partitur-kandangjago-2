name: Auto Update PDF List
on:
push:
branches: [ main, master ]
paths:
- 'partitur/'
permissions:
contents: write
jobs:
update-list:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Generate list_pdf.json
run: |
python3 -c 'import os, json; files = ["partitur/" + f for f in os.listdir("partitur") if f.lower().endswith(".pdf")] if os.path.exists("partitur") else []; f = open("list_pdf.json", "w"); json.dump(files, f); f.close()'
- name: Commit and push changes
run: |
git config --local user.email "action@github.com"
git config --local user.name "GitHub Action Bot"
git add list_pdf.json
git commit -m "Auto-generate PDF list" || echo "No changes to commit"
git push
